    <rect x="91.4" y="0" width="91.4" height="240" fill="#facc15"/>
    <rect x="182.8" y="0" width="91.4" height="240" fill="#22d3ee"/>
    <rect x="274.2" y="0" width="91.4" height="240" fill="#4ade80"/>
    <rect x="365.6" y="0" width="91.4" height="240" fill="#f472b6"/>
    <rect x="457" y="0" width="91.4" height="240" fill="#ef4444"/>
