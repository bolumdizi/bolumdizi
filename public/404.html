<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yükleniyor... – bölüm dizi</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var cleanPath = path.replace(/^\/+|\/+$/g, '');
      var parts = cleanPath.split('/');

      // 1. Episode Match: /:showSlug/:s-sezon-:b-bolum.html
      // e.g. /avatar-seven-havens/1-sezon-1-bolum.html
      if (parts.length >= 2) {
        var showSlug = parts[0];
        var epPart = parts[1];
        var epMatch = epPart.match(/^(\d+)-sezon-(\d+)-bolum(\.html)?$/i);
        if (epMatch) {
          var season = epMatch[1];
          var episode = epMatch[2];
          window.location.replace('/bolum.html?s=' + encodeURIComponent(showSlug) + '&se=' + encodeURIComponent(season) + '&ep=' + encodeURIComponent(episode));
          return;
        }
      }

      // Also check 1 part if someone entered 1-sezon-1-bolum.html with ?s=
      if (parts.length === 1 && parts[0].match(/^(\d+)-sezon-(\d+)-bolum(\.html)?$/i)) {
        var m = parts[0].match(/^(\d+)-sezon-(\d+)-bolum(\.html)?$/i);
        var searchParams = new URLSearchParams(window.location.search);
        var s = searchParams.get('s') || '';
        window.location.replace('/bolum.html?s=' + encodeURIComponent(s) + '&se=' + encodeURIComponent(m[1]) + '&ep=' + encodeURIComponent(m[2]));
        return;
      }

      // 2. Series Match: /:showSlug (e.g. /avatar-seven-havens or /breaking-bad)
      if (parts.length === 1 && parts[0] && !parts[0].includes('.')) {
        var knownPages = ['diziler', 'animeler', 'forum', 'profil', 'takvim', 'kesfet', 'admin', 'trendler', 'bolum', 'dizi'];
        if (knownPages.indexOf(parts[0].toLowerCase()) !== -1) {
          window.location.replace('/' + parts[0].toLowerCase() + '.html' + window.location.search);
          return;
        }
        window.location.replace('/dizi.html?s=' + encodeURIComponent(parts[0]));
        return;
      }

      // 3. Fallback to homepage
      window.location.replace('/' + window.location.search);
    })();
  </script>
  <style>
    body {
      background: #0b0f19;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      display: inline-block;
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ff3b47;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div>
    <div class="loader"></div>
    <div style="font-size:15px;color:rgba(255,255,255,0.85);font-weight:600">Bölüm yükleniyor, lütfen bekleyin...</div>
  </div>
</body>
</html>
