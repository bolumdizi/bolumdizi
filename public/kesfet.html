<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dizi Keşfet & Filtrele - BölümDizi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .filter-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 36px;
      box-shadow: var(--shadow-card);
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      align-items: flex-end;
    }
    .filter-control-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="logo-brand">
        <div class="logo-icon"><i class="fa-solid fa-play"></i></div>
        <div class="logo-text"><span>BÖLÜM</span><span>DİZİ</span></div>
      </a>
      <div class="search-wrapper">
        <div class="search-input-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="globalSearchInput" placeholder="Dizi ara..." autocomplete="off">
        </div>
        <div class="search-results-dropdown" id="searchResultsDropdown"></div>
      </div>
      <ul class="nav-links">
        <li><a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Ana Sayfa</a></li>
        <li><a href="/takvim" class="nav-link"><i class="fa-regular fa-calendar-days"></i> Dizi Takvimi</a></li>
        <li><a href="/kesfet" class="nav-link active"><i class="fa-solid fa-compass"></i> Keşfet</a></li>
      </ul>
      <div class="header-actions">
        <a href="/admin" class="btn-header-admin"><i class="fa-solid fa-sliders"></i> Yönetim Paneli</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="section-header" style="margin-top: 10px;">
      <div>
        <h1 class="section-title" style="font-size: 1.9rem;"><i class="fa-solid fa-filter" style="color: var(--primary);"></i> Gelişmiş Dizi Filtresi & Keşfet</h1>
        <p style="color: var(--text-muted); margin-top: 6px; font-size: 0.95rem;">
          Türe, IMDb puanına, yayın yılına ve durumuna göre dilediğin yabancı diziyi anında keşfet.
        </p>
      </div>
    </div>

    <!-- Filtre Paneli -->
    <div class="filter-panel">
      <div class="filter-grid">
        <div class="filter-control-group">
          <label><i class="fa-solid fa-tags"></i> Dizi Türü</label>
          <select id="filterGenre" class="form-control" style="background: var(--bg-deep); border-color: rgba(255,255,255,0.12);">
            <option value="all">Tüm Türler</option>
            <option value="Dram">Dram</option>
            <option value="Bilim Kurgu">Bilim Kurgu</option>
            <option value="Aksiyon">Aksiyon</option>
            <option value="Gerilim">Gerilim</option>
            <option value="Suç">Suç</option>
            <option value="Komedi">Komedi</option>
            <option value="Gizem">Gizem</option>
            <option value="Fantastik">Fantastik</option>
            <option value="Korku">Korku</option>
          </select>
        </div>

        <div class="filter-control-group">
          <label><i class="fa-solid fa-signal"></i> Durum</label>
          <select id="filterStatus" class="form-control" style="background: var(--bg-deep); border-color: rgba(255,255,255,0.12);">
            <option value="all">Tümü</option>
            <option value="Devam Ediyor">Devam Edenler</option>
            <option value="Tamamlandı">Bitenler (Final)</option>
          </select>
        </div>

        <div class="filter-control-group">
          <label><i class="fa-solid fa-arrow-down-wide-short"></i> Sıralama Ölçütü</label>
          <select id="filterSort" class="form-control" style="background: var(--bg-deep); border-color: rgba(255,255,255,0.12);">
            <option value="default">En Yeniler</option>
            <option value="imdb">En Yüksek IMDb Puanı</option>
            <option value="views">En Çok İzlenenler</option>
            <option value="year">Yayın Yılına Göre</option>
          </select>
        </div>

        <div class="filter-control-group">
          <button class="btn-primary" style="width: 100%; justify-content: center; height: 44px;" onclick="applyFilters()">
            <i class="fa-solid fa-magnifying-glass"></i> Filtrele
          </button>
        </div>
      </div>
    </div>

    <!-- Sonuç Başlığı & Kartlar Izgarası -->
    <div class="section-header">
      <h2 class="section-title" id="resultsCountTitle">Tüm Diziler</h2>
    </div>

    <div class="series-grid" id="exploreSeriesGrid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div>© 2026 BölümDizi - Tüm hakları saklıdır.</div>
      <div>DiziBox & SezonlukDizi Hybrid Edition</div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    async function applyFilters() {
      const genre = document.getElementById('filterGenre').value;
      const status = document.getElementById('filterStatus').value;
      const sort = document.getElementById('filterSort').value;
      const grid = document.getElementById('exploreSeriesGrid');
      const countTitle = document.getElementById('resultsCountTitle');

      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--primary);"></i><br><br>Diziler yükleniyor...</div>';

      try {
        let url = `/api/series?`;
        if (genre !== 'all') url += `genre=${encodeURIComponent(genre)}&`;
        if (status !== 'all') url += `status=${encodeURIComponent(status)}&`;
        if (sort !== 'default') url += `sort=${encodeURIComponent(sort)}&`;

        const res = await fetch(url);
        const series = await res.json();

        countTitle.textContent = `${series.length} Dizi Listelendi`;

        if (series.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-dim); font-size: 1rem;">Seçilen kriterlere uygun dizi bulunamadı.</div>';
          return;
        }

        grid.innerHTML = series.map(s => `
          <a href="/dizi/${s.slug}" class="series-card">
            <div class="series-poster-box">
              <img src="${s.poster}" alt="${s.title}" onerror="this.src='https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=500'">
              <span class="series-badge-imdb"><i class="fa-solid fa-star"></i> ${s.imdb}</span>
              <span class="series-badge-status ${s.status === 'Devam Ediyor' ? 'ongoing' : ''}">${s.status}</span>
            </div>
            <div class="series-card-info">
              <h4 class="series-card-title">${s.title}</h4>
              <div class="series-card-meta">
                <span><i class="fa-regular fa-calendar"></i> ${s.year}</span>
                <span>${(s.genres || []).slice(0, 2).join(', ')}</span>
              </div>
            </div>
          </a>
        `).join('');

      } catch (err) {
        console.error('Filter error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('genre')) document.getElementById('filterGenre').value = urlParams.get('genre');
      if (urlParams.get('sort')) document.getElementById('filterSort').value = urlParams.get('sort');
      applyFilters();
    });
  </script>
</body>
</html>
