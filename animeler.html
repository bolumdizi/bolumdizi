<script>
let curGenre = "Tümü";
let curSort = "pop";
let curSearch = "";
let curMinImdb = 0;

function parseQueryParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("genre")) curGenre = params.get("genre");
  if (params.get("q")) curSearch = params.get("q");
  if (params.get("sort")) curSort = params.get("sort");
  if (params.get("imdb")) curMinImdb = parseFloat(params.get("imdb")) || 0;
}

function renderGenreChips() {
  const container = el("genre_chips");
  if (!container) return;
  const genres = ["Tümü","Aksiyon","Macera","Fantastik","Doğaüstü","Bilim Kurgu","Gizem","Dram"];
  container.innerHTML = genres.map(g => `
    <span class="chip${g.toLowerCase() === curGenre.toLowerCase() ? ' on' : ''}" data-genre="${g}">${g}</span>
  `).join("");
}

function renderAnimeCatalog() {
  let list = API.getSeries('anime').slice();

  // 1. Genre filter
  if (curGenre && curGenre !== "Tümü") {
    list = list.filter(item => item[1] && item[1].toLowerCase().includes(curGenre.toLowerCase()));
  }

  // 2. Search query filter
  if (curSearch && curSearch.trim()) {
    const qTrim = curSearch.trim().toLowerCase();
    list = list.filter(item => item[0].toLowerCase().includes(qTrim) || (item[1] && item[1].toLowerCase().includes(qTrim)));
  }

  // 3. IMDb Score filter
  if (curMinImdb > 0) {
    list = list.filter(item => (parseFloat(item[2]) || 0) >= curMinImdb);
  }

  // 4. Sorting
  if (curSort === "imdb_desc") {
    list.sort((a, b) => (parseFloat(b[2]) || 0) - (parseFloat(a[2]) || 0));
  } else if (curSort === "year_desc") {
    list.sort((a, b) => (parseInt(b[3]) || 0) - (parseInt(a[3]) || 0));
  } else if (curSort === "title_asc") {
    list.sort((a, b) => a[0].localeCompare(b[0], 'tr'));
  }

  const gridEl = el("anime_grid");
  const countText = el("anime_count_text");
  if (countText) {
    const details = [];
    if (curGenre !== "Tümü") details.push(curGenre);
    if (curSearch && curSearch.trim()) details.push(`"${curSearch.trim()}"`);
    if (curMinImdb > 0) details.push(`★ ${curMinImdb}+`);
    const detailStr = details.length ? ` (${details.join(" · ")})` : "";
    countText.textContent = `${list.length} anime listeleniyor${detailStr}`;
  }

  if (gridEl) {
    if (list.length === 0) {
      gridEl.innerHTML = `<div class="empty" style="grid-column:1/-1;padding:40px;text-align:center">Kriterlere uygun anime bulunamadı. Lütfen aramanızı veya filtreleri değiştirin.</div>`;
    } else {
      gridEl.innerHTML = list.map((t, idx) => card(t, idx, "ANİME")).join("");
    }
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  await API.init();
  parseQueryParams();

  const searchInput = el("cat_search_input");
  const searchBtn = el("cat_search_btn");
  const searchClr = el("cat_search_clear");
  const imdbSelect = el("cat_imdb_select");
  const sortSelect = el("sort_select");
  const resetBtn = el("cat_reset_btn");

  if (searchInput) {
    searchInput.value = curSearch;
    if (curSearch) searchClr.style.display = "flex";

    const triggerSearch = () => {
      curSearch = searchInput.value;
      if (searchClr) searchClr.style.display = curSearch ? "flex" : "none";
      renderAnimeCatalog();
    };

    searchInput.addEventListener("input", triggerSearch);
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        triggerSearch();
      }
    });
  }

  if (searchBtn) {
    searchBtn.onclick = () => {
      if (searchInput) curSearch = searchInput.value;
      renderAnimeCatalog();
    };
  }

  if (searchClr && searchInput) {
    searchClr.onclick = () => {
      searchInput.value = "";
      searchClr.style.display = "none";
      curSearch = "";
      renderAnimeCatalog();
      searchInput.focus();
    };
  }

  if (imdbSelect) {
    imdbSelect.value = curMinImdb > 0 ? curMinImdb.toFixed(1) : "0";
    imdbSelect.onchange = () => {
      curMinImdb = parseFloat(imdbSelect.value) || 0;
      renderAnimeCatalog();
    };
  }

  if (sortSelect) {
    sortSelect.value = curSort;
    sortSelect.onchange = () => {
      curSort = sortSelect.value;
      renderAnimeCatalog();
    };
  }

  if (resetBtn) {
    resetBtn.onclick = () => {
      curGenre = "Tümü";
      curSearch = "";
      curMinImdb = 0;
      curSort = "pop";
      if (searchInput) {
        searchInput.value = "";
        searchClr.style.display = "none";
      }
      if (imdbSelect) imdbSelect.value = "0";
      if (sortSelect) sortSelect.value = "pop";
      renderGenreChips();
      renderAnimeCatalog();
    };
  }

  renderGenreChips();
  renderAnimeCatalog();

  const gChips = el("genre_chips");
  if (gChips) {
    gChips.onclick = e => {
      const chip = e.target.closest("[data-genre]");
      if (chip) {
        gChips.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
        chip.classList.add("on");
        curGenre = chip.dataset.genre;
        renderAnimeCatalog();
      }
    };
  }
});
</script>
