<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastgele Yapıma Yönlendiriliyor... – bölüm dizi</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='lg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3b47'/%3E%3Cstop offset='1' stop-color='%23a30610'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='38' height='38' rx='10' fill='url(%23lg)'/%3E%3Cpath d='M15 11.5v17l14-8.5z' fill='%23fff'/%3E%3Crect x='8' y='31' width='24' height='2.5' rx='1.25' fill='%23fff' opacity='.9'/%3E%3Crect x='8' y='31' width='14' height='2.5' rx='1.25' fill='%23ffb400'/%3E%3C/svg%3E">
<script src="public/js/data.js?v=4.4"></script>
<script>
(function() {
  var list = [];
  try {
    var raw = localStorage.getItem('bolumdizi_data_v8');
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed.T || parsed.AN) list = (parsed.T || []).concat(parsed.AN || []);
    }
  } catch(e) {}
  if (!list.length && window.DEFAULT_SERIES) {
    list = (window.DEFAULT_SERIES || []).concat(window.DEFAULT_ANIME || []);
  }
  if (list && list.length > 0) {
    var params = new URLSearchParams(window.location.search);
    var currentShow = (params.get('s') || '').trim().toLowerCase();
    var pool = list;
    if (currentShow && list.length > 1) {
      var filtered = list.filter(function(item) {
        var t = (Array.isArray(item) ? item[0] : (item && (item.title || item.name))) || '';
        return String(t).trim().toLowerCase() !== currentShow;
      });
      if (filtered.length > 0) pool = filtered;
    }
    var picked = pool[Math.floor(Math.random() * pool.length)];
    var title = (Array.isArray(picked) ? picked[0] : (picked && (picked.title || picked.name))) || '';
    if (title) {
      window.location.replace('dizi.html?s=' + encodeURIComponent(title));
      return;
    }
  }
  window.location.replace('diziler.html');
})();
</script>
</head>
<body style="background:#0e1117;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:system-ui,-apple-system,sans-serif">
  <div style="text-align:center">
    <div style="font-size:28px;margin-bottom:8px">🎲</div>
    <div style="font-size:14px;color:#888">Rastgele dizi veya animeye yönlendiriliyorsunuz...</div>
  </div>
</body>
</html>
