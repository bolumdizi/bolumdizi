}

function resizeImageFile(file, maxWidth, maxHeight, quality, callback) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
      if (h > maxHeight) { h = Math.round(h * (maxHeight / h)); h = maxHeight; }
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      callback(cv.toDataURL("image/jpeg", quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

const DEFAULT_IMDB_IDS = {
  "Breaking Bad": "tt0903747", "Dark": "tt5753856", "Game of Thrones": "tt0944947",
  "Stranger Things": "tt4574334", "The Last of Us": "tt3581920", "Peaky Blinders": "tt2442560",
  "Succession": "tt7660850", "Better Call Saul": "tt3032476", "Severance": "tt11280740",
  "The Bear": "tt14452776", "Black Mirror": "tt2085059", "Squid Game": "tt10919420",
  "Attack on Titan": "tt2560140", "Death Note": "tt0877057", "Fullmetal Alchemist: Brotherhood": "tt1355642",
  "Demon Slayer": "tt9335498", "Jujutsu Kaisen": "tt12343534", "One Piece": "tt0388629",
  "Naruto": "tt0409591", "Cowboy Bebop": "tt0213338", "The Mentalist": "tt1196946"
};

function mapGenreToTr(genres) {
  if (!genres || !genres.length) return "Dram";
  const trDict = {
    "action": "Aksiyon", "adventure": "Macera", "animation": "Anime", "anime": "Anime",
    "comedy": "Komedi", "crime": "Suç", "documentary": "Belgesel", "drama": "Dram",
    "family": "Aile", "fantasy": "Fantastik", "history": "Tarih", "horror": "Korku",
    "music": "Müzik", "musical": "Müzik", "mystery": "Gizem", "romance": "Romantik",
    "sci-fi": "Bilim Kurgu", "science-fiction": "Bilim Kurgu", "thriller": "Gerilim",
    "war": "Savaş", "western": "Vahşi Batı", "supernatural": "Doğaüstü"
  };
  const trList = genres.map(g => {
    const key = String(g).toLowerCase().trim();
    return trDict[key] || g;
  }).filter((v, i, a) => a.indexOf(v) === i);

  return trList.length ? trList.join(", ") : "Dram";
}

async function translateSummaryToTurkish(text, title, year, genreTr) {
  if (!text || !text.trim()) {
    return `${title}, ${year} yılında yayınlanan, yüksek IMDb puanına sahip sürükleyici bir ${genreTr} yapımıdır. Tüm bölümleri Full HD Türkçe Dublaj ve Altyazılı olarak izleyebilirsiniz.`;
  }
  let clean = text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  if (!clean) return '';
  try {
    const sentences = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const chunks = [];
    let cur = '';
    for (const s of sentences) {
      if ((cur + ' ' + s).length < 400) {
        cur += (cur ? ' ' : '') + s;
      } else {
        if (cur) chunks.push(cur);
        cur = s.slice(0, 400);
      }
    }
    if (cur) chunks.push(cur);

    const toTranslate = chunks.slice(0, 2);
    const translatedParts = await Promise.all(toTranslate.map(async chunk => {
      try {
        const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(chunk) + '&langpair=en|tr');
        if (res.ok) {
          const json = await res.json();
          if (json && json.responseData && json.responseData.translatedText) {
            return json.responseData.translatedText;
          }
        }
      } catch (e) {}
      return '';
    }));
    const result = translatedParts.filter(Boolean).join(' ').trim();
    if (result && result.length > 10) return result;
  } catch (err) {}
  return `${title}, ${year} yılında yayınlanan, yüksek IMDb puanına sahip sürükleyici bir ${genreTr} yapımıdır. Tüm bölümleri Full HD Türkçe Dublaj ve Altyazılı olarak izleyebilirsiniz.`;
}

async function fetchImdbSeriesData(inputStr) {
  if (!inputStr || !inputStr.trim()) throw new Error("Lütfen bir dizi adı, IMDb ID veya linki girin.");
  const cleanInput = inputStr.trim();
  let imdbId = null;
  const m = cleanInput.match(/tt\d{6,10}/i);
  if (m) {
    imdbId = m[0].toLowerCase();
  } else {
    // Başlık girildiyse (örn: "Breaking Bad", "Dark", "Severance")
    if (typeof DEFAULT_IMDB_IDS !== 'undefined' && DEFAULT_IMDB_IDS[cleanInput]) {
      imdbId = DEFAULT_IMDB_IDS[cleanInput];
    } else {
      try {
        const sr = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(cleanInput)}`);
        if (sr.ok) {
          const sObj = await sr.json();
          if (sObj && sObj.externals && sObj.externals.imdb) {
            imdbId = sObj.externals.imdb.toLowerCase();
          }
        }
      } catch (e) {}
    }
  }

  if (!imdbId) {
    throw new Error(`"${cleanInput}" için IMDb ID'si veya eşleşen dizi bulunamadı. Lütfen "tt..." formatında IMDb kodunu girin.`);
  }

  // 1. Cinemeta meta çağrısı (Gerçek IMDb Puanı ve Bölüm/Sezon Verisi)
  let cineMeta = null;
  try {
    const res = await fetch(`https://v3-cinemeta.strem.io/meta/series/${imdbId}.json`);
    if (res.ok) {
      const cJson = await res.json();
      if (cJson && cJson.meta) cineMeta = cJson.meta;
    }
  } catch (e) {}

  // 2. TVMaze çağrısı (Türkçe özet çevirisi ve ek meta)
  let tvShow = null;
  let tvEpisodes = null;
  try {
    const res = await fetch(`https://api.tvmaze.com/lookup/shows?imdb=${imdbId}`);
    if (res.ok) {
      tvShow = await res.json();
      if (tvShow && tvShow.id) {
        try {
          const epRes = await fetch(`https://api.tvmaze.com/shows/${tvShow.id}/episodes`);
          if (epRes.ok) tvEpisodes = await epRes.json();
        } catch (e) {}
      }
    }
  } catch (e) {}

  if (!cineMeta && !tvShow) {
    throw new Error(`"${imdbId}" için IMDb verisi bulunamadı.`);
  }

  // Sezon, Bölüm haritasını ve yayın tarihlerini hesapla
  const epMap = {};
  const epDates = {};
  let totalEps = 0;
  let maxSeason = 1;

  if (cineMeta && Array.isArray(cineMeta.videos) && cineMeta.videos.length > 0) {
    const regularVideos = cineMeta.videos.filter(v => v.season > 0);
    totalEps = regularVideos.length || cineMeta.videos.length;
    regularVideos.forEach(v => {
      const s = parseInt(v.season) || 1;
      const b = parseInt(v.number || v.episode) || 1;
      epMap[s] = (epMap[s] || 0) + 1;
      if (s > maxSeason) maxSeason = s;
      const rel = v.released || v.firstAired;
      if (rel) {
        epDates[`${s}_${b}`] = formatEpisodeAirDate(rel);
      }
    });
  } else if (Array.isArray(tvEpisodes) && tvEpisodes.length > 0) {
    const regularEps = tvEpisodes.filter(e => e.season > 0);
    totalEps = regularEps.length || tvEpisodes.length;
    regularEps.forEach(e => {
      const s = parseInt(e.season) || 1;
      const b = parseInt(e.number) || 1;
      epMap[s] = (epMap[s] || 0) + 1;
      if (s > maxSeason) maxSeason = s;
      const rel = e.airdate || e.airstamp;
      if (rel && !epDates[`${s}_${b}`]) {
        epDates[`${s}_${b}`] = formatEpisodeAirDate(rel);
      }
    });
  } else {
    epMap[1] = 8;
    totalEps = 8;
    maxSeason = 1;
  }

  // Gerçek IMDb puanı (Cinemeta imdbRating birinci öncelik)
  let realRating = 8.5;
  if (cineMeta && cineMeta.imdbRating) {
    realRating = parseFloat(cineMeta.imdbRating) || 8.5;
  } else if (tvShow && tvShow.rating && tvShow.rating.average) {
    realRating = parseFloat(tvShow.rating.average) || 8.5;
  }

  const title = (cineMeta && cineMeta.name) || (tvShow && tvShow.name) || cleanInput;
  const genres = (cineMeta && cineMeta.genres && cineMeta.genres.length) ? cineMeta.genres : ((tvShow && tvShow.genres) || []);
  const genreTr = mapGenreToTr(genres);
  const year = cineMeta ? (parseInt(cineMeta.year) || 2024) : (tvShow && tvShow.premiered ? parseInt(tvShow.premiered.slice(0, 4)) : 2024);
  const rawSummary = (cineMeta && cineMeta.description) || (tvShow && tvShow.summary ? tvShow.summary.replace(/<[^>]*>/g, '').trim() : '');
  const trSummary = await translateSummaryToTurkish(rawSummary, title, year, genreTr);
  const poster = (cineMeta && cineMeta.poster) || (tvShow && tvShow.image && (tvShow.image.original || tvShow.image.medium)) || '';
  const backdrop = (cineMeta && cineMeta.background) || (tvShow && tvShow.image && tvShow.image.original) || poster;
  const isAnime = Boolean(
    (genres && genres.some(g => String(g).toLowerCase().includes("anime"))) ||
    (tvShow && tvShow.type && tvShow.type.toLowerCase() === "animation" && tvShow.network && tvShow.network.country && tvShow.network.country.code === "JP")
  );

  const firstEpDate = epDates['1_1'] || (year ? `${year}` : 'Yeni');

  return {
    source: cineMeta ? "IMDb / Cinemeta" : "TVMaze",
    imdbId,
    title,
    rating: realRating,
    year,
    genres,
    genreTr,
    poster,
    backdrop,
    summary: trSummary,
    isAnime,
    seasons: maxSeason,
    totalEpisodes: totalEps,
    epMap,
    epDates,
    firstEpDate
  };
}

  container.querySelectorAll(".adm-nav-tab").forEach(tab => {
    tab.addEventListener("click", () => {

          </div>

        renderAdminView();

    // Dosya Yükleme Önizleme

    if (fileInp) {
      fileInp.addEventListener("change", e => {

        if (!file) return;
        resizeImageFile(file, 400, 600, 0.8, base64Url => {
          el("ns_poster").value = base64Url;
          el("ns_preview").src = base64Url;
          el("ns_preview_wrap").style.display = "flex";

      });

    el("ns_clear_img")?.addEventListener("click", () => {
      el("ns_poster").value = "";
      el("ns_preview").src = "";
      el("ns_preview_wrap").style.display = "none";
    });

    // IMDb Getir
    el("btn_fetch_imdb")?.addEventListener("click", async () => {
      const val = (el("ns_imdb_id")?.value || el("ns_title")?.value || "").trim();
      const btn = el("btn_fetch_imdb");
      const infoBox = el("imdb_fetch_info");
      if (!val) {
        showToast("Lütfen bir dizi adı veya IMDb ID'si girin (örn: tt0903747 veya Breaking Bad)");
        return;
      }
      btn.textContent = "⏳ Getiriliyor...";
      btn.disabled = true;
      if (infoBox) {
        infoBox.style.display = "block";
        infoBox.innerHTML = "IMDb verileri, puanı ve bölüm detayları taranıyor...";
      }

      try {
        const meta = await fetchImdbSeriesData(val);
        window._lastFetchedMeta = meta;
        if (el("ns_title")) el("ns_title").value = meta.title;
        if (el("ns_year")) el("ns_year").value = meta.year;
        if (el("ns_imdb")) el("ns_imdb").value = meta.rating;
        if (el("ns_genre")) el("ns_genre").value = meta.genreTr;
        if (el("ns_type")) el("ns_type").value = meta.isAnime ? "anime" : "dizi";
        if (el("ns_seasons")) el("ns_seasons").value = meta.seasons;
        if (el("ns_episodes")) el("ns_episodes").value = meta.totalEpisodes;
        if (el("ns_summary")) el("ns_summary").value = meta.summary;
        if (meta.imdbId && el("ns_imdb_id")) el("ns_imdb_id").value = meta.imdbId;
        if (el("ns_ep_date") && meta.firstEpDate) el("ns_ep_date").value = meta.firstEpDate;
        if (meta.poster && el("ns_poster")) {
          el("ns_poster").value = meta.poster;
          el("ns_preview").src = meta.poster;
          el("ns_preview_wrap").style.display = "flex";
        }
        if (infoBox) {
          infoBox.innerHTML = `✅ <b>${escapeHtml(meta.title)}</b> başarıyla çekildi! (★ ${meta.rating} IMDb · ${meta.year} · ${meta.seasons} Sezon · ${meta.totalEpisodes} Bölüm · Yayın Tarihi: <b>${meta.firstEpDate || 'Bilinmiyor'}</b>)`;
        }
        showToast(`IMDb verileri yüklendi: ★ ${meta.rating} IMDb · ${meta.seasons} Sezon · Yayın Tarihi: ${meta.firstEpDate || 'Var'}`);
      } catch (err) {
        if (infoBox) infoBox.innerHTML = `❌ Hata: ${err.message}`;
        showToast(err.message);
      } finally {
        btn.textContent = isEdit ? "⚡ Bilgileri Çek & Güncelle" : "⚡ Bilgileri Getir";
        btn.disabled = false;
      }
    });

    // Diziyi Kaydet
    el("btn_save_series")?.addEventListener("click", async () => {
      const title = (el("ns_title")?.value || "").trim();
      const type = el("ns_type")?.value || "dizi";
      const genre = el("ns_genre")?.value || "Dram";
      const imdb = parseFloat(el("ns_imdb")?.value) || 8.0;
      const year = parseInt(el("ns_year")?.value) || 2024;
      const poster = (el("ns_poster")?.value || "").trim();
      const summary = (el("ns_summary")?.value || "").trim();
      const imdbId = (el("ns_imdb_id")?.value || "").trim();
      const epDateVal = (el("ns_ep_date")?.value || window._lastFetchedMeta?.firstEpDate || "").trim();

      const seasons = parseInt(el("ns_seasons")?.value) || (window._lastFetchedMeta?.seasons) || (isEdit && itm && itm[6]?.seasons) || 1;
      const totalEpisodes = parseInt(el("ns_episodes")?.value) || (window._lastFetchedMeta?.totalEpisodes) || (isEdit && itm && itm[6]?.totalEpisodes) || 8;
      
      let epMap = (isEdit && itm && itm[6]?.epMap) ? { ...itm[6].epMap } : {};
      const epMapStr = (el("ns_ep_map")?.value || "").trim();
      if (epMapStr) {
        epMap = {};

          const pair = part.split(':').map(x => x.trim());
          if (pair[0] && pair[1] && !isNaN(parseInt(pair[1]))) {
            epMap[pair[0]] = parseInt(pair[1]);
          }
        });
      } else if (window._lastFetchedMeta?.epMap) {
        epMap = window._lastFetchedMeta.epMap;
      }
      if (!Object.keys(epMap).length) {
        epMap = { [seasons]: totalEpisodes };
      }

      if (!title) {
        showToast("Lütfen bir başlık girin.");
        return;
      }

      const status = el("ns_status")?.value || (isEdit && itm && itm[6]?.status) || "Final Yaptı";

      const metaObj = {
        imdbId: imdbId || (window._lastFetchedMeta?.imdbId) || (isEdit && itm && itm[6]?.imdbId) || "",
        seasons,
        totalEpisodes,
        epMap,
        status,
        epDates: (window._lastFetchedMeta?.epDates) || (isEdit && itm && itm[6]?.epDates) || {},
        firstEpDate: epDateVal
      };

      const item = [title, genre, imdb, year, poster, summary, metaObj];
      const isAnime = type === "anime";
      const oldTitle = isEdit ? itm[0] : null;

      await API.saveSeries(item, isAnime, oldTitle);

      // Dizi eklenirken zaman ibaresi ile bölümü bağla
      const existingEps = API.getEpisodes(title);
      if (!isEdit && existingEps.length === 0 && epDateVal) {
        await API.saveEpisode({
          t: [title, genre, imdb, year, poster, metaObj.backdrop || poster],
          s: 1,
          b: 1,
          lg: "Altyazı",
          ago: epDateVal,
          embed: ""
        });
      } else if (existingEps.length > 0 && epDateVal) {
        existingEps.forEach(ep => {
          const epKey = `${ep.s}_${ep.b}`;
          if (metaObj.epDates && metaObj.epDates[epKey]) {
            ep.ago = metaObj.epDates[epKey];
          } else if (ep.s === 1 && ep.b === 1) {
            ep.ago = epDateVal;
          }
        });
        API.saveLocal();
        API.syncToCloud().catch(() => {});
      }

      editingTarget = null;
      window._lastFetchedMeta = null;
      showToast(`${title} başarıyla kaydedildi! (★ ${imdb} IMDb · ${seasons} Sezon · ${totalEpisodes} Bölüm)`);
      renderAdminView();
    });
  }
  else if (admSubTab === "episodes") {
    const isEditEp = (editingEpIdx !== null && episodes[editingEpIdx]);

      if (matchIdx >= 0) curSeriesIdx = matchIdx;

    } else if (currEp && currEp.embed && currEp.embed.trim()) {
      currentEpPlayers = [{ name: "Oynatıcı 1", embed: currEp.embed }];
    } else {
      currentEpPlayers = [{ name: "Oynatıcı 1", embed: "" }];

        <h3 style="margin:0 0 16px;font-size:18px;color:var(--tx)">${isEditEp ? '✏️ Bölümü Düzenle' : (admEpPrefillS ? `➕ Bölüm Ekle / Video Bağla (${escapeHtml(admEpFilterShow)} ${sVal}. Sezon ${bVal}. Bölüm)` : '➕ Yeni Bölüm Ekle (Son Eklenenler Akışına)')}</h3>

            <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--mut)">Bölüm Numarası</label>
            <input id="ne_b" class="fi" style="width:100%" type="number" min="1" value="${bVal}">
          </div>

            <select id="ne_lg" class="fi" style="width:100%">
              <option value="Dublaj" ${currEp && currEp.lg==='Dublaj'?'selected':''}>Türkçe Dublaj</option>
              <option value="Altyazı" ${currEp && currEp.lg==='Altyazı'?'selected':''}>Türkçe Altyazı</option>
            </select>
          </div>
          <div class="adm-field">
            <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--mut)">Video Kalitesi</label>
            <select id="ne_q" class="fi" style="width:100%">
              <option value="1080p" ${(currEp && (currEp.q==='1080p' || !currEp.q))?'selected':''}>1080p Full HD</option>
              <option value="4K" ${currEp && currEp.q==='4K'?'selected':''}>4K Ultra HD</option>
              <option value="720p" ${currEp && currEp.q==='720p'?'selected':''}>720p HD</option>

    async function updateEpAirDate() {
      const seriesIdx = parseInt(el("ne_series")?.value);
      const s = parseInt(el("ne_s")?.value) || 1;
      const b = parseInt(el("ne_b")?.value) || 1;
      const show = all[seriesIdx];
      if (!show) return;
      const showTitle = show[0];
      const meta = show[6] && typeof show[6] === 'object' ? show[6] : null;
      const epKey = `${s}_${b}`;

      if (meta && meta.epDates && meta.epDates[epKey]) {
        if (el("ne_ago")) el("ne_ago").value = meta.epDates[epKey];
        return;
      }

      const imdbId = (meta && meta.imdbId) || (typeof DEFAULT_IMDB_IDS !== 'undefined' ? DEFAULT_IMDB_IDS[showTitle] : null);
      const fetchBtn = el("btn_fetch_ep_date");
      if (fetchBtn) fetchBtn.textContent = "⏳...";

      if (imdbId) {
        try {
          const res = await fetch(`https://v3-cinemeta.strem.io/meta/series/${imdbId}.json`);
          if (res.ok) {
            const cJson = await res.json();
            if (cJson && cJson.meta && Array.isArray(cJson.meta.videos)) {
              const v = cJson.meta.videos.find(x => parseInt(x.season) === s && parseInt(x.number || x.episode) === b);
              if (v && (v.released || v.firstAired)) {
                const formatted = formatEpisodeAirDate(v.released || v.firstAired);
                if (el("ne_ago")) el("ne_ago").value = formatted;
                if (!meta.epDates) meta.epDates = {};
                meta.epDates[epKey] = formatted;
                if (fetchBtn) fetchBtn.textContent = "✓ Geldi";
                setTimeout(() => { if (fetchBtn) fetchBtn.textContent = "⚡ IMDb'den Çek"; }, 1500);
                return;
              }
            }
          }
        } catch (err) {}
      }

      // TVMaze fallback
      try {
        const sr = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(showTitle)}&embed=episodes`);
        if (sr.ok) {
          const sObj = await sr.json();
          if (sObj && sObj._embedded && Array.isArray(sObj._embedded.episodes)) {
            const epFound = sObj._embedded.episodes.find(x => parseInt(x.season) === s && parseInt(x.number) === b);
            if (epFound && (epFound.airdate || epFound.airstamp)) {
              const formatted = formatEpisodeAirDate(epFound.airdate || epFound.airstamp);
              if (el("ne_ago")) el("ne_ago").value = formatted;
              if (fetchBtn) fetchBtn.textContent = "✓ Geldi";
              setTimeout(() => { if (fetchBtn) fetchBtn.textContent = "⚡ IMDb'den Çek"; }, 1500);
              return;
            }
          }
        }
      } catch (err) {}

      if (fetchBtn) fetchBtn.textContent = "⚡ IMDb'den Çek";
    }

    el("btn_fetch_ep_date")?.addEventListener("click", updateEpAirDate);
    el("ne_series")?.addEventListener("change", () => { if (!isEditEp) updateEpAirDate(); });
    el("ne_s")?.addEventListener("change", () => { if (!isEditEp) updateEpAirDate(); });
    el("ne_b")?.addEventListener("change", () => { if (!isEditEp) updateEpAirDate(); });

    if (!isEditEp && (!currEp || !currEp.ago || currEp.ago === 'Yeni')) {
      updateEpAirDate();
    }
  }
  else if (admSubTab === "manage") {
    const filtered = all.map((t, idx) => ({ t, idx, isAnime: idx >= API.data.series.length }))
      .filter(x => !admSearchQ || x.t[0].toLowerCase().includes(admSearchQ.toLowerCase()));

    sv.innerHTML = `
      <div class="adm-card" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
          <h3 style="margin:0;font-size:18px;color:var(--tx)">📋 Mevcut İçerikler (${all.length}) — Düzenle & Sil</h3>
          <button class="btn" id="btn_sync_all_genres_imdb" style="font-size:12.5px;padding:8px 14px;cursor:pointer">⚡ Tüm Dizi Türlerini IMDb'den Güncelle</button>
        </div>
        <input id="adm_sq" class="fi" style="width:100%;margin-bottom:16px;box-sizing:border-box" placeholder="İçerik başlığında ara…" value="${escapeHtml(admSearchQ)}">
        <div class="adm-list" style="display:flex;flex-direction:column;gap:10px">
          ${filtered.length ? filtered.map(x => {
            const d = getD(x.idx);
            const cover = x.t[4] || getCover(x.t[0]);
            const meta = x.t[6] && typeof x.t[6] === 'object' ? x.t[6] : null;
            const sCount = (meta && meta.seasons) ? meta.seasons : 1;
            const epCount = (meta && meta.totalEpisodes) ? meta.totalEpisodes : API.getEpisodes(x.t[0]).length;
            const thumb = cover
              ? `<img src="${cover}" style="width:36px;height:50px;object-fit:cover;border-radius:4px;flex:none">`
              : `<div style="width:36px;height:50px;background:linear-gradient(160deg,${d[0]});border-radius:4px;flex:none"></div>`;
            return `
              <div class="adm-item" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--input-bg);border:1px solid var(--line);border-radius:10px;gap:12px;flex-wrap:wrap">
                <div class="adm-item-info" style="display:flex;align-items:center;gap:12px">
                  ${thumb}
                  <div>
                    <b style="font-size:14px;color:var(--tx)">${escapeHtml(x.t[0])}</b>
                    <span class="mut" style="font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px">${x.isAnime?'Anime':'Dizi'} · <span style="color:var(--ac2)">${escapeHtml(x.t[1])}</span> · ${x.t[3]} · <b style="color:var(--ac2)">★ ${x.t[2]} IMDb</b> · <span style="color:#4ade80">${sCount} Sezon (${epCount} Bölüm)</span> · ${getShowStatusBadgeHtml(getShowStatus(x.t))}</span>
                  </div>
                </div>
                <div class="adm-btn-group" style="display:flex;gap:8px;flex-wrap:wrap">
                  <button class="adm-edit btn g" data-manage-episodes="${escapeHtml(x.t[0])}" style="background:rgba(34,197,94,0.15);color:#4ade80;font-size:12px;padding:6px 12px;cursor:pointer">🎬 Bölümleri Düzenle</button>
                  <button class="adm-edit btn g" data-sync-imdb="${escapeHtml(x.t[0])}" style="background:rgba(255,180,0,0.15);color:var(--ac2);border:1px solid rgba(255,180,0,0.3);font-size:12px;padding:6px 12px;cursor:pointer">⚡ IMDb ile Güncelle</button>
                  <button class="adm-edit btn g" data-edit-item="${escapeHtml(x.t[0])}" style="font-size:12px;padding:6px 12px;cursor:pointer">✏️ Dizi Düzenle</button>
                  <button class="adm-del btn g" data-del-item="${escapeHtml(x.t[0])}" style="font-size:12px;padding:6px 12px;color:#ff5252;cursor:pointer">🗑️ Sil</button>
                </div>
              </div>
            `;
          }).join("") : `<div style="padding:24px;text-align:center;color:var(--mut)">Eşleşen içerik bulunamadı.</div>`}
        </div>
      </div>`;

    el("adm_sq")?.addEventListener("input", e => {
      admSearchQ = e.target.value.trim();
      renderAdmSub();
    });

    el("btn_sync_all_genres_imdb")?.addEventListener("click", async () => {
      const btn = el("btn_sync_all_genres_imdb");
      btn.textContent = "⏳ IMDb Verileri Çekiliyor...";
      btn.disabled = true;
      let count = 0;
      for (const item of all) {
        const title = item[0];
        const imdbId = (item[6] && item[6].imdbId) || (typeof DEFAULT_IMDB_IDS !== 'undefined' ? DEFAULT_IMDB_IDS[title] : null) || title;
        try {
          const meta = await fetchImdbSeriesData(imdbId);
          if (meta) {
            item[1] = meta.genreTr;
            item[2] = meta.rating;
            item[3] = meta.year;
            if (meta.summary) item[5] = meta.summary;
            item[6] = {
              imdbId: meta.imdbId,
              seasons: meta.seasons,
              totalEpisodes: meta.totalEpisodes,
              epMap: meta.epMap
            };
            const isAnime = API.data.anime.some(a => a[0].toLowerCase() === title.toLowerCase());
            await API.saveSeries(item, isAnime, title);
            count++;
          }
        } catch (e) {
          console.warn(title, e.message);
        }
      }
      btn.textContent = "⚡ Tüm Dizi Bilgilerini IMDb'den Güncelle (Puan, Sezon, Bölüm & Tür)";
      btn.disabled = false;
      showToast(`${count} dizinin IMDb puanı, sezon/bölüm sayısı ve türü güncellendi! ☁️`);
      renderAdminView();
    });

    sv.querySelectorAll("[data-sync-imdb]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const title = btn.getAttribute("data-sync-imdb");
        const found = all.find(x => x[0].toLowerCase() === title.toLowerCase());
        if (!found) return;
        const imdbId = (found[6] && found[6].imdbId) || (typeof DEFAULT_IMDB_IDS !== 'undefined' ? DEFAULT_IMDB_IDS[title] : null) || title;
        btn.textContent = "⏳ Çekiliyor...";
        btn.disabled = true;
        try {
          const meta = await fetchImdbSeriesData(imdbId);
          found[1] = meta.genreTr;
          found[2] = meta.rating;
          found[3] = meta.year;
          if (meta.summary) found[5] = meta.summary;
          if (meta.poster && !found[4]) found[4] = meta.poster;
          found[6] = {
            imdbId: meta.imdbId,
            seasons: meta.seasons,
            totalEpisodes: meta.totalEpisodes,
            epMap: meta.epMap
          };
          const isAnime = API.data.anime.some(a => a[0].toLowerCase() === title.toLowerCase());
          await API.saveSeries(found, isAnime, title);
          showToast(`"${title}" güncellendi: ★ ${meta.rating} IMDb · ${meta.seasons} Sezon · ${meta.totalEpisodes} Bölüm ⚡`);
          renderAdminView();
        } catch (err) {
          showToast(`Hata: ${err.message}`);
          btn.textContent = "⚡ IMDb ile Güncelle";
          btn.disabled = false;
        }
      });
    });

    sv.querySelectorAll("[data-manage-episodes]").forEach(btn => {
      btn.addEventListener("click", () => {
        admSubTab = "episodes";
        admEpFilterShow = btn.getAttribute("data-manage-episodes");
        renderAdminView();
      });
    });

    sv.querySelectorAll("[data-edit-item]").forEach(btn => {
      btn.addEventListener("click", () => {
        const title = btn.getAttribute("data-edit-item");
        const found = all.find(x => x[0].toLowerCase() === title.toLowerCase());
        if (found) {
          const isAnime = API.data.anime.some(x => x[0].toLowerCase() === title.toLowerCase());
          editingTarget = { data: found, isAnime };
          admSubTab = "series";
          renderAdminView();
        }
      });
    });

    sv.querySelectorAll("[data-del-item]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const title = btn.getAttribute("data-del-item");
        if (!confirm(`"${title}" içeriğini ve tüm bölümlerini silmek istediğinize emin misiniz?`)) return;
        await API.deleteSeries(title);
        showToast(`"${title}" silindi.`);
        renderAdminView();
      });
    });
  }
  else if (admSubTab === "supabase") {
    const cfg = getSupabaseConfig();
    const isConn = Boolean(sbClient);
    sv.innerHTML = `
      <div class="adm-card" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <h3 style="margin:0;font-size:18px;color:var(--tx)">☁️ Çoklu Cihaz & Bulut Senkronizasyonu</h3>
          <span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:${isConn?'rgba(74,222,128,0.2)':'rgba(255,255,255,0.1)'};color:${isConn?'#4ade80':'var(--mut)'}">
            ${isConn ? '● Supabase Bulut Aktif' : '○ Yerel Mod (LocalStorage)'}
          </span>
        </div>
        <p class="mut" style="margin-bottom:18px;font-size:13.5px;line-height:1.5">
          Bilgisayardan yaptığınız dizi, anime ve bölüm değişikliklerinin <b>telefonunuzda, tabletinizde veya başka cihazlarda anında görünmesi</b> için veriler Supabase bulutuna otomatik eşitlenir.
        </p>

        <div style="background:var(--input-bg);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
          <div>
            <b style="font-size:14px;color:var(--tx);display:block;margin-bottom:3px">📡 Cihazlar Arası Anlık Eşitleme Durumu</b>
            <span class="mut" style="font-size:12px">Son Bulut Güncellemesi: ${API.data && API.data.series ? API.data.series.length + ' Dizi, ' + (API.data.anime||[]).length + ' Anime, ' + (API.data.episodes||[]).length + ' Bölüm hazır' : 'Hazır'}</span>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn" id="btn_cloud_sync_now" style="font-size:13px;padding:9px 16px;cursor:pointer">☁️ Şimdi Buluta Gönder (Tüm Cihazlara Dağıt)</button>
            <button class="btn g" id="btn_cloud_pull_now" style="font-size:13px;padding:9px 16px;cursor:pointer">📥 Buluttan Verileri Yenile</button>
          </div>
        </div>

        <div class="adm-grid" style="display:grid;grid-template-columns:1fr;gap:14px">
          <div class="adm-field">
            <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--mut)">Supabase Proje URL'si (Project URL)</label>
            <input id="sb_url_inp" class="fi" style="width:100%" placeholder="https://xyzcompany.supabase.co" value="${escapeHtml(cfg.url || '')}">
          </div>
          <div class="adm-field">
            <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--mut)">Supabase Anon Açık Anahtarı (Anon Public Key)</label>
            <input id="sb_key_inp" class="fi" style="width:100%" type="password" placeholder="eyJhbGciOiJIUzI1Ni..." value="${escapeHtml(cfg.key || '')}">
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
          <button class="btn" id="btn_save_supabase" style="padding:10px 20px;cursor:pointer">💾 Ayarları Kaydet ve Bağlan</button>
        </div>
      </div>`;

    el("btn_cloud_sync_now")?.addEventListener("click", async () => {
      const btn = el("btn_cloud_sync_now");
      btn.textContent = "⏳ Eşitleniyor...";
      btn.disabled = true;
      const ok = await API.syncToCloud();
      btn.textContent = "☁️ Şimdi Buluta Gönder (Tüm Cihazlara Dağıt)";
      btn.disabled = false;
      if (ok) showToast("Tüm veriler Supabase Bulutuna yüklendi! Artık diğer cihazlarınızda da görünür. ☁️");
      else showToast("Bulut eşitleme hatası. Lütfen Supabase ayarlarını kontrol edin.");
    });

    el("btn_cloud_pull_now")?.addEventListener("click", async () => {
      const btn = el("btn_cloud_pull_now");
      btn.textContent = "⏳ Çekiliyor...";
      btn.disabled = true;
      const ok = await API.loadCloud();
      btn.textContent = "📥 Buluttan Verileri Yenile";
      btn.disabled = false;
      if (ok) {
        showToast("Buluttaki en güncel veriler çekildi!");
        renderAdminView();
      } else {
        showToast("Buluttan veri çekilemedi.");
      }
    });

    el("btn_save_supabase")?.addEventListener("click", () => {
      const url = (el("sb_url_inp")?.value || "").trim();
      const key = (el("sb_key_inp")?.value || "").trim();
      if (!url || !key) {
        showToast("Lütfen URL ve anahtarı doldurun.");
        return;
      }
      localStorage.setItem("bolumdizi_supabase_cfg_v1", JSON.stringify({ url, key }));
      initSupabase();
      showToast("Supabase ayarları güncellendi!");
      renderAdminView();
    });
  }
  else if (admSubTab === "backup") {
    sv.innerHTML = `
      <div class="adm-card" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)">
        <h3 style="margin:0 0 12px;font-size:18px;color:var(--tx)">💾 Veri Yedekleme & Sıfırlama</h3>
        <p class="mut" style="margin-bottom:16px;font-size:14px">Eklediğiniz içerikler veritabanında ve tarayıcıda saklanır. Verileri JSON formatında kopyalayabilir veya varsayılanlara dönebilirsiniz:</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn" id="btn_export_json" style="padding:10px 20px;cursor:pointer">📋 Verileri JSON Olarak Kopyala</button>
          <button class="btn g" id="btn_reset_def" style="padding:10px 20px;color:#ff5252;cursor:pointer">🔄 Varsayılanlara Sıfırla</button>
        </div>
      </div>`;

    el("btn_export_json")?.addEventListener("click", () => {
      const json = JSON.stringify(API.data, null, 2);
      navigator.clipboard.writeText(json).then(() => {
        showToast("JSON verisi panoya kopyalandı!");
      });
    });

    el("btn_reset_def")?.addEventListener("click", () => {
      if (!confirm("Tüm değişiklikleri sıfırlayıp varsayılan listeye dönmek istediğinize emin misiniz?")) return;
      localStorage.removeItem("bolumdizi_data_v8");
      API.loadLocal();
      showToast("Varsayılanlar yüklendi.");
      renderAdminView();
    });
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  await API.init();
  updateAuthUI();

  // Check URL query parameters for pre-fills (e.g. ?editShow=Severance&s=1&b=2)
  const params = new URLSearchParams(window.location.search);
  const editShow = params.get("editShow");
  const sNum = params.get("s");
  const bNum = params.get("b");

  if (editShow) {
    admSubTab = "episodes";
    admEpFilterShow = editShow;
    if (sNum) admEpPrefillS = parseInt(sNum);
    if (bNum) admEpPrefillB = parseInt(bNum);
  }

  renderAdminView();
});
</script>
</body>
</html>
