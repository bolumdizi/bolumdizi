function resizeImageFile(file, maxWidth, maxHeight, quality, callback) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
      if (h > maxHeight) { h = Math.round(h * (maxHeight / h)); h = maxHeight; }
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      callback(cv.toDataURL("image/jpeg", quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function mapGenreToTr(genres) {
  if (!genres || !genres.length) return "Dram";
  const trDict = {
    "action": "Aksiyon", "adventure": "Macera", "animation": "Anime", "anime": "Anime",
    "comedy": "Komedi", "crime": "Suç", "documentary": "Belgesel", "drama": "Dram",
    "family": "Aile", "fantasy": "Fantastik", "history": "Tarih", "horror": "Korku",
    "music": "Müzik", "musical": "Müzik", "mystery": "Gizem", "romance": "Romantik",
    "sci-fi": "Bilim Kurgu", "science-fiction": "Bilim Kurgu", "thriller": "Gerilim",
    "war": "Savaş", "western": "Vahşi Batı", "supernatural": "Doğaüstü"
  };
  const trList = genres.map(g => {
    const key = String(g).toLowerCase().trim();
    return trDict[key] || g;
  }).filter((v, i, a) => a.indexOf(v) === i);

  return trList.length ? trList.join(", ") : "Dram";
}

async function translateSummaryToTurkish(text, title, year, genreTr) {
  if (!text || !text.trim()) {
    return `${title}, ${year} yılında yayınlanan, yüksek IMDb puanına sahip sürükleyici bir ${genreTr} yapımıdır. Tüm bölümleri Full HD Türkçe Dublaj ve Altyazılı olarak izleyebilirsiniz.`;
  }
  let clean = text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  if (!clean) return '';
  try {
    const sentences = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    const chunks = [];
    let cur = '';
    for (const s of sentences) {
      if ((cur + ' ' + s).length < 400) {
        cur += (cur ? ' ' : '') + s;
      } else {
        if (cur) chunks.push(cur);
        cur = s.slice(0, 400);
      }
    }
    if (cur) chunks.push(cur);

    const toTranslate = chunks.slice(0, 2);
    const translatedParts = await Promise.all(toTranslate.map(async chunk => {
      try {
        const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(chunk) + '&langpair=en|tr');
        if (res.ok) {
          const json = await res.json();
          if (json && json.responseData && json.responseData.translatedText) {
            return json.responseData.translatedText;
          }
        }
      } catch (e) {}
      return '';
    }));
    const result = translatedParts.filter(Boolean).join(' ').trim();
    if (result && result.length > 10) return result;
  } catch (err) {}
  return `${title}, ${year} yılında yayınlanan, yüksek IMDb puanına sahip sürükleyici bir ${genreTr} yapımıdır. Tüm bölümleri Full HD Türkçe Dublaj ve Altyazılı olarak izleyebilirsiniz.`;
}

async function fetchImdbSeriesData(inputStr) {
  if (!inputStr || !inputStr.trim()) throw new Error("Lütfen bir IMDb ID veya linki girin.");
  const m = inputStr.match(/tt\d{6,10}/i);
  if (!m) throw new Error("Geçerli bir IMDb numarası (örn: tt1196946) bulunamadı.");
  const imdbId = m[0].toLowerCase();

  let result = null;
  try {
    const res = await fetch(`https://api.tvmaze.com/lookup/shows?imdb=${imdbId}`);
    if (res.ok) {
      const show = await res.json();
      if (show && show.id) {
        let epMap = {};
        let totalEps = 0;
        let maxSeason = 1;
        try {
          const epRes = await fetch(`https://api.tvmaze.com/shows/${show.id}/episodes`);
          if (epRes.ok) {
            const eps = await epRes.json();
            if (Array.isArray(eps)) {
              totalEps = eps.length;
              eps.forEach(e => {
                const s = parseInt(e.season) || 1;
                epMap[s] = (epMap[s] || 0) + 1;
                if (s > maxSeason) maxSeason = s;
              });
            }
          }
        } catch (epErr) {}

        const isAnime = Boolean(
          (show.genres && show.genres.some(g => g.toLowerCase() === "anime")) ||
          (show.type && show.type.toLowerCase() === "animation" && show.network && show.network.country && show.network.country.code === "JP")
        );
        const cleanSummary = show.summary ? show.summary.replace(/<[^>]*>/g, '').trim() : '';
        const genreTr = mapGenreToTr(show.genres);
        const year = show.premiered ? parseInt(show.premiered.slice(0, 4)) : 2024;
        const trSummary = await translateSummaryToTurkish(cleanSummary, show.name, year, genreTr);

        result = {
          source: "TVMaze", imdbId, title: show.name,
          rating: show.rating && show.rating.average ? parseFloat(show.rating.average) : 8.0,
          year, genres: show.genres || [], genreTr,
          poster: (show.image && (show.image.original || show.image.medium)) ? (show.image.original || show.image.medium) : '',
          summary: trSummary, isAnime, seasons: maxSeason, totalEpisodes: totalEps, epMap
        };
      }
    }
  } catch (err) {}

  if (!result) {
    try {
      const res = await fetch(`https://v3-cinemeta.strem.io/meta/series/${imdbId}.json`);
      if (res.ok) {
        const json = await res.json();
        if (json && json.meta) {
          const mMeta = json.meta;
          let epMap = {};
          let maxSeason = 1;
          let totalEps = 0;
          if (Array.isArray(mMeta.videos)) {
            totalEps = mMeta.videos.length;
            mMeta.videos.forEach(v => {
              const s = parseInt(v.season) || 1;
              epMap[s] = (epMap[s] || 0) + 1;
              if (s > maxSeason) maxSeason = s;
            });
          }
          const isAnime = Boolean(mMeta.genres && mMeta.genres.some(g => g.toLowerCase().includes("anime")));
          const genreTr = mapGenreToTr(mMeta.genres);
          const year = parseInt(mMeta.year) || 2024;
          const trSummary = await translateSummaryToTurkish(mMeta.description, mMeta.name, year, genreTr);

          result = {
            source: "Cinemeta", imdbId, title: mMeta.name,
            rating: mMeta.imdbRating ? parseFloat(mMeta.imdbRating) : 8.0,
            year, genres: mMeta.genres || [], genreTr,
            poster: mMeta.poster || '',
            summary: trSummary, isAnime, seasons: maxSeason, totalEpisodes: totalEps, epMap
          };
        }
      }
    } catch (err) {}
  }

  if (!result) throw new Error(`"${imdbId}" için dizi bilgisi bulunamadı.`);
  return result;
}

        ${isEdit ? `

              <b style="font-size:13.5px;color:var(--tx);display:flex;align-items:center;gap:6px">

            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <button type="button" class="btn" id="btn_goto_series_episodes" data-show="${escapeHtml(itm[0])}" style="font-size:12px;padding:7px 14px;cursor:pointer">

    if (isEdit) {
      el("btn_cancel_edit")?.addEventListener("click", () => {

        if (!file) return;
        resizeImageFile(file, 400, 600, 0.8, base64Url => {
          el("ns_poster").value = base64Url;
          el("ns_preview").src = base64Url;
          el("ns_preview_wrap").style.display = "flex";

      el("ns_preview").src = "";

    // IMDb Getir
    el("btn_fetch_imdb")?.addEventListener("click", async () => {
      const val = (el("ns_imdb_id")?.value || "").trim();

      const infoBox = el("imdb_fetch_info");
      if (!val) {
        showToast("Lütfen bir IMDb ID'si girin (örn: tt1196946)");
        return;
      }
      btn.textContent = "⏳ Getiriliyor...";
      btn.disabled = true;
      if (infoBox) {
        infoBox.style.display = "block";
        infoBox.innerHTML = "IMDb verileri ve bölüm detayları taranıyor...";
      }

      try {
        const meta = await fetchImdbSeriesData(val);
        if (el("ns_title")) el("ns_title").value = meta.title;
        if (el("ns_year")) el("ns_year").value = meta.year;
        if (el("ns_imdb")) el("ns_imdb").value = meta.rating;
        if (el("ns_genre")) el("ns_genre").value = meta.genreTr;
        if (el("ns_type")) el("ns_type").value = meta.isAnime ? "anime" : "dizi";
        if (el("ns_summary")) el("ns_summary").value = meta.summary;
        if (meta.poster && el("ns_poster")) {
          el("ns_poster").value = meta.poster;
          el("ns_preview").src = meta.poster;
          el("ns_preview_wrap").style.display = "flex";

      const isAnime = type === "anime";

          ifr.style.height = "100%";
          ifr.style.border = "none";

        wrap.innerHTML = `<iframe src="${code}" style="width:100%;height:100%;border:none" allowfullscreen></iframe>`;

      const b = parseInt(el("ne_b")?.value) || 1;
      const lg = el("ne_lg")?.value || "Dublaj";

      const embed = (el("ne_embed")?.value || "").trim();

      const epObj = { t: [target[0]], s, b, lg, ago, embed };
      await API.saveEpisode(epObj, isEditEp ? editingEpIdx : null);

      editingEpIdx = null;
      admEpPrefillS = null;
      admEpPrefillB = null;
      showToast(`${target[0]} ${s}. Sezon ${b}. Bölüm kaydedildi!`);
      renderAdmSub();

      editingEpIdx = null;
      admEpPrefillS = null;
      admEpPrefillB = null;
      renderAdmSub();

        renderAdmSub();

        </div>
        <input id="adm_sq" class="fi" style="width:100%;margin-bottom:16px;box-sizing:border-box" placeholder="İçerik başlığında ara…" value="${escapeHtml(admSearchQ)}">

                  <div>
                    <b style="font-size:14px;color:var(--tx)">${escapeHtml(x.t[0])}</b>
                    <span class="mut" style="font-size:12px;display:block">${x.isAnime?'Anime':'Dizi'} · <span style="color:var(--ac2)">${escapeHtml(x.t[1])}</span> · ${x.t[3]} · ★ ${x.t[2]}</span>
                  </div>
                </div>
                <div class="adm-btn-group" style="display:flex;gap:8px;flex-wrap:wrap">
                  <button class="adm-edit btn g" data-manage-episodes="${escapeHtml(x.t[0])}" style="background:rgba(34,197,94,0.15);color:#4ade80;font-size:12px;padding:6px 12px;cursor:pointer">🎬 Bölümleri Düzenle</button>
                  <button class="adm-edit btn g" data-sync-imdb="${escapeHtml(x.t[0])}" style="background:rgba(255,180,0,0.15);color:var(--ac2);border:1px solid rgba(255,180,0,0.3);font-size:12px;padding:6px 12px;cursor:pointer">⚡ IMDb ile Güncelle</button>
                  <button class="adm-edit btn g" data-edit-item="${escapeHtml(x.t[0])}" style="font-size:12px;padding:6px 12px;cursor:pointer">✏️ Dizi Düzenle</button>
                  <button class="adm-del btn g" data-del-item="${escapeHtml(x.t[0])}" style="font-size:12px;padding:6px 12px;color:#ff5252;cursor:pointer">🗑️ Sil</button>
                </div>
              </div>
            `;
          }).join("") : `<div style="padding:24px;text-align:center;color:var(--mut)">Eşleşen içerik bulunamadı.</div>`}
        </div>
      </div>`;

    el("adm_sq")?.addEventListener("input", e => {
      admSearchQ = e.target.value.trim();
      renderAdmSub();
    });

    el("btn_sync_all_genres_imdb")?.addEventListener("click", async () => {
      const btn = el("btn_sync_all_genres_imdb");
      btn.textContent = "⏳ IMDb Türleri Çekiliyor...";
      btn.disabled = true;
      let count = 0;
      for (const item of all) {
        const title = item[0];
        const imdbId = (item[6] && item[6].imdbId) || DEFAULT_IMDB_IDS[title];
        if (!imdbId) continue;
        try {
          const meta = await fetchImdbSeriesData(imdbId);
          if (meta && meta.genreTr) {
            item[1] = meta.genreTr;
            const isAnime = API.data.anime.some(a => a[0].toLowerCase() === title.toLowerCase());
            await API.saveSeries(item, isAnime, title);
            count++;
          }
        } catch (e) {
          console.warn(title, e.message);
        }
      }
      btn.textContent = "⚡ Tüm Dizi Türlerini IMDb'den Güncelle";
      btn.disabled = false;
      showToast(`${count} dizinin türü IMDb üzerinden güncellendi ve tüm cihazlara eşitlendi! ☁️`);
      renderAdminView();
    });

    sv.querySelectorAll("[data-sync-imdb]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const title = btn.getAttribute("data-sync-imdb");
        const found = all.find(x => x[0].toLowerCase() === title.toLowerCase());
        if (!found) return;
        const imdbId = (found[6] && found[6].imdbId) || DEFAULT_IMDB_IDS[title];
        if (!imdbId) {
          showToast(`"${title}" için IMDb numarası bulunamadı. Düzenle butonundan IMDb ID ekleyin.`);
          return;
        }
        btn.textContent = "⏳ Çekiliyor...";
        btn.disabled = true;
        try {
          const meta = await fetchImdbSeriesData(imdbId);
          found[1] = meta.genreTr;
          found[2] = meta.rating;
          found[3] = meta.year;
          if (meta.summary) found[5] = meta.summary;
          if (meta.poster && !found[4]) found[4] = meta.poster;
          const isAnime = API.data.anime.some(a => a[0].toLowerCase() === title.toLowerCase());
          await API.saveSeries(found, isAnime, title);
          showToast(`"${title}" türü ve bilgileri IMDb'den güncellendi: ${meta.genreTr} ⚡`);
          renderAdminView();
        } catch (err) {
          showToast(`Hata: ${err.message}`);
          btn.textContent = "⚡ IMDb ile Güncelle";
          btn.disabled = false;
        }
      });
    });

    sv.querySelectorAll("[data-manage-episodes]").forEach(btn => {
      btn.addEventListener("click", () => {
        admSubTab = "episodes";
        admEpFilterShow = btn.getAttribute("data-manage-episodes");
        renderAdminView();
      });
    });

    sv.querySelectorAll("[data-edit-item]").forEach(btn => {
      btn.addEventListener("click", () => {
        const title = btn.getAttribute("data-edit-item");
        const found = all.find(x => x[0].toLowerCase() === title.toLowerCase());
        if (found) {
          const isAnime = API.data.anime.some(x => x[0].toLowerCase() === title.toLowerCase());
          editingTarget = { data: found, isAnime };
          admSubTab = "series";
          renderAdminView();
        }
      });
    });

    sv.querySelectorAll("[data-del-item]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const title = btn.getAttribute("data-del-item");
        if (!confirm(`"${title}" içeriğini ve tüm bölümlerini silmek istediğinize emin misiniz?`)) return;
        await API.deleteSeries(title);
        showToast(`"${title}" silindi.`);
        renderAdminView();
      });
    });
  }
  else if (admSubTab === "supabase") {
    const cfg = getSupabaseConfig();
    const isConn = Boolean(sbClient);
    sv.innerHTML = `
      <div class="adm-card" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <h3 style="margin:0;font-size:18px;color:var(--tx)">☁️ Çoklu Cihaz & Bulut Senkronizasyonu</h3>
          <span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:${isConn?'rgba(74,222,128,0.2)':'rgba(255,255,255,0.1)'};color:${isConn?'#4ade80':'var(--mut)'}">
            ${isConn ? '● Supabase Bulut Aktif' : '○ Yerel Mod (LocalStorage)'}
          </span>
        </div>
        <p class="mut" style="margin-bottom:18px;font-size:13.5px;line-height:1.5">
          Bilgisayardan yaptığınız dizi, anime ve bölüm değişikliklerinin <b>telefonunuzda, tabletinizde veya başka cihazlarda anında görünmesi</b> için veriler Supabase bulutuna otomatik eşitlenir.
        </p>

        <div style="background:var(--input-bg);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
          <div>
            <b style="font-size:14px;color:var(--tx);display:block;margin-bottom:3px">📡 Cihazlar Arası Anlık Eşitleme Durumu</b>
            <span class="mut" style="font-size:12px">Son Bulut Güncellemesi: ${API.data && API.data.series ? API.data.series.length + ' Dizi, ' + (API.data.anime||[]).length + ' Anime, ' + (API.data.episodes||[]).length + ' Bölüm hazır' : 'Hazır'}</span>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn" id="btn_cloud_sync_now" style="font-size:13px;padding:9px 16px;cursor:pointer">☁️ Şimdi Buluta Gönder (Tüm Cihazlara Dağıt)</button>
            <button class="btn g" id="btn_cloud_pull_now" style="font-size:13px;padding:9px 16px;cursor:pointer">📥 Buluttan Verileri Yenile</button>
          </div>
        </div>

        <div class="adm-grid" style="display:grid;grid-template-columns:1fr;gap:14px">
          <div class="adm-field">
            <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--mut)">Supabase Proje URL'si (Project URL)</label>
            <input id="sb_url_inp" class="fi" style="width:100%" placeholder="https://xyzcompany.supabase.co" value="${escapeHtml(cfg.url || '')}">
          </div>
          <div class="adm-field">
            <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--mut)">Supabase Anon Açık Anahtarı (Anon Public Key)</label>
            <input id="sb_key_inp" class="fi" style="width:100%" type="password" placeholder="eyJhbGciOiJIUzI1Ni..." value="${escapeHtml(cfg.key || '')}">
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
          <button class="btn" id="btn_save_supabase" style="padding:10px 20px;cursor:pointer">💾 Ayarları Kaydet ve Bağlan</button>
        </div>
      </div>`;

    el("btn_cloud_sync_now")?.addEventListener("click", async () => {
      const btn = el("btn_cloud_sync_now");
      btn.textContent = "⏳ Eşitleniyor...";
      btn.disabled = true;
      const ok = await API.syncToCloud();
      btn.textContent = "☁️ Şimdi Buluta Gönder (Tüm Cihazlara Dağıt)";
      btn.disabled = false;
      if (ok) showToast("Tüm veriler Supabase Bulutuna yüklendi! Artık diğer cihazlarınızda da görünür. ☁️");
      else showToast("Bulut eşitleme hatası. Lütfen Supabase ayarlarını kontrol edin.");
    });

    el("btn_cloud_pull_now")?.addEventListener("click", async () => {
      const btn = el("btn_cloud_pull_now");
      btn.textContent = "⏳ Çekiliyor...";
      btn.disabled = true;
      const ok = await API.loadCloud();
      btn.textContent = "📥 Buluttan Verileri Yenile";
      btn.disabled = false;
      if (ok) {
        showToast("Buluttaki en güncel veriler çekildi!");
        renderAdminView();
      } else {
        showToast("Buluttan veri çekilemedi.");
      }
    });

    el("btn_save_supabase")?.addEventListener("click", () => {
      const url = (el("sb_url_inp")?.value || "").trim();
      const key = (el("sb_key_inp")?.value || "").trim();
      if (!url || !key) {
        showToast("Lütfen URL ve anahtarı doldurun.");
        return;
      }
      localStorage.setItem("bolumdizi_supabase_cfg_v1", JSON.stringify({ url, key }));
      initSupabase();
      showToast("Supabase ayarları güncellendi!");
      renderAdminView();
    });
  }
  else if (admSubTab === "backup") {
    sv.innerHTML = `
      <div class="adm-card" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)">
        <h3 style="margin:0 0 12px;font-size:18px;color:var(--tx)">💾 Veri Yedekleme & Sıfırlama</h3>
        <p class="mut" style="margin-bottom:16px;font-size:14px">Eklediğiniz içerikler veritabanında ve tarayıcıda saklanır. Verileri JSON formatında kopyalayabilir veya varsayılanlara dönebilirsiniz:</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn" id="btn_export_json" style="padding:10px 20px;cursor:pointer">📋 Verileri JSON Olarak Kopyala</button>
          <button class="btn g" id="btn_reset_def" style="padding:10px 20px;color:#ff5252;cursor:pointer">🔄 Varsayılanlara Sıfırla</button>
        </div>
      </div>`;

    el("btn_export_json")?.addEventListener("click", () => {
      const json = JSON.stringify(API.data, null, 2);
      navigator.clipboard.writeText(json).then(() => {
        showToast("JSON verisi panoya kopyalandı!");
      });
    });

    el("btn_reset_def")?.addEventListener("click", () => {
      if (!confirm("Tüm değişiklikleri sıfırlayıp varsayılan listeye dönmek istediğinize emin misiniz?")) return;
      localStorage.removeItem("bolumdizi_data_v8");
      API.loadLocal();
      showToast("Varsayılanlar yüklendi.");
      renderAdminView();
    });
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  await API.init();
  updateAuthUI();

  // Check URL query parameters for pre-fills (e.g. ?editShow=Severance&s=1&b=2)
  const params = new URLSearchParams(window.location.search);
  const editShow = params.get("editShow");
  const sNum = params.get("s");
  const bNum = params.get("b");

  if (editShow) {
    admSubTab = "episodes";
    admEpFilterShow = editShow;
    if (sNum) admEpPrefillS = parseInt(sNum);
    if (bNum) admEpPrefillB = parseInt(bNum);
  }

  renderAdminView();
});
</script>
</body>
</html>
