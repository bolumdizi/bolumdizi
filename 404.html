<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>BölümDizi - Yönlendiriliyor...</title>
  <script>
    // GitHub Pages SPA router
    // Converts /dizi/slug or /dizi/slug/sezon-1/bolum-1 to the appropriate HTML page with query parameters
    const path = window.location.pathname;

    const watchMatch = path.match(/\/dizi\/([^\/]+)\/sezon-(\d+)\/bolum-(\d+)/);
    if (watchMatch) {
      window.location.replace('/izle.html?slug=' + watchMatch[1] + '&season=' + watchMatch[2] + '&episode=' + watchMatch[3]);
    } else {
      const seriesMatch = path.match(/\/dizi\/([^\/]+)/);
      if (seriesMatch) {
        window.location.replace('/dizi.html?slug=' + seriesMatch[1]);
      } else if (path.includes('/takvim')) {
        window.location.replace('/takvim.html');
      } else if (path.includes('/kesfet')) {
        window.location.replace('/kesfet.html');
      } else if (path.includes('/admin')) {
        window.location.replace('/admin.html');
      } else {
        window.location.replace('/');
      }
    }
  </script>
</head>
<body style="background: #080b10; color: #fff; font-family: sans-serif; text-align: center; padding: 100px;">
  <h2>Yükleniyor, lütfen bekleyin...</h2>
</body>
</html>
