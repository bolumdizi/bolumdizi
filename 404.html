<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='lg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3b47'/%3E%3Cstop offset='1' stop-color='%23a30610'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='38' height='38' rx='10' fill='url(%23lg)'/%3E%3Cpath d='M15 11.5v17l14-8.5z' fill='%23fff'/%3E%3Crect x='8' y='31' width='24' height='2.5' rx='1.25' fill='%23fff' opacity='.9'/%3E%3Crect x='8' y='31' width='14' height='2.5' rx='1.25' fill='%23ffb400'/%3E%3C/svg%3E">
<link rel="alternate icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
  <title>Yükleniyor... – bölüm dizi</title>
  <style>
    body {
      background: #0b0f19;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      display: inline-block;
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ff3b47;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      var path = window.location.pathname;
      var cleanPath = path.replace(/^\/+|\/+$/g, '');
      var parts = cleanPath.split('/');

      function renderTargetPage(targetHtmlUrl) {
        fetch(targetHtmlUrl)
          .then(function(res) {
            if (!res.ok) throw new Error('Page not found');
            return res.text();
          })
          .then(function(html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function(err) {
            window.location.replace('/' + window.location.search);
          });
      }

      // 1. Episode Match: /:showSlug/:s-sezon-:b-bolum.html
      // e.g. /avatar-seven-havens/1-sezon-1-bolum.html
      if (parts.length >= 2) {
        var epPart = parts[1];
        var epMatch = epPart.match(/^(\d+)-sezon-(\d+)-bolum(\.html)?$/i);
        if (epMatch) {
          renderTargetPage('/bolum.html');
          return;
        }
      }

      // Also check 1 part if someone entered 1-sezon-1-bolum.html
      if (parts.length === 1 && parts[0].match(/^(\d+)-sezon-(\d+)-bolum(\.html)?$/i)) {
        renderTargetPage('/bolum.html');
        return;
      }

      // 2. Series Match: /:showSlug (e.g. /avatar-seven-havens or /breaking-bad)
      if (parts.length === 1 && parts[0] && !parts[0].includes('.')) {
        var knownPages = ['diziler', 'animeler', 'forum', 'iletisim', 'profil', 'kesfet', 'admin', 'trendler', 'bolum', 'dizi'];
        if (knownPages.indexOf(parts[0].toLowerCase()) !== -1) {
          window.location.replace('/' + parts[0].toLowerCase() + '.html' + window.location.search);
          return;
        }
        renderTargetPage('/dizi.html');
        return;
      }

      // 3. Fallback to homepage
      window.location.replace('/' + window.location.search);
    })();
  </script>
</head>
<body>
  <div>
    <div class="loader"></div>
    <div style="font-size:15px;color:rgba(255,255,255,0.85);font-weight:600">Bölüm yükleniyor, lütfen bekleyin...</div>
  </div>
</body>
</html>
